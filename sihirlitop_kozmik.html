<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kozmik Kehanet Küresi | Yüksek Boyuttan Mesaj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cosmic-gold: #f5d77f;
            --cosmic-cyan: #38bdf8;
            --cosmic-blue: #00d2ff;
            --cosmic-violet: #a855f7;
            --cosmic-pink: #f43f5e;
            --deep-space: #03010a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--deep-space);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Arka Plan Uzay Canvası */
        #spaceCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Kozmik Efekt ve Uçan Yıldız Canvası (HER ŞEYİN EN ÜSTÜNDE) */
        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        /* Ekran Boyutsal Parlama Flaşı */
        #screenFlash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.35) 0%, rgba(168, 85, 247, 0.2) 60%, transparent 100%);
            pointer-events: none;
            z-index: 9998;
            opacity: 0;
            transition: opacity 0.1s ease-out;
        }

        /* Kozmik Arka Plan Bulutsuları (Nebula) */
        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 2;
            animation: nebulaDrift 25s infinite alternate ease-in-out;
        }

        .nebula-1 {
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, #7209b7 0%, rgba(58, 12, 163, 0) 70%);
            top: -160px;
            right: -100px;
        }

        .nebula-2 {
            width: 850px;
            height: 850px;
            background: radial-gradient(circle, #0f4c81 0%, rgba(56, 189, 248, 0) 75%);
            bottom: -220px;
            left: -160px;
            animation-duration: 34s;
        }

        .nebula-3 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #e056fd 0%, rgba(244, 63, 94, 0) 70%);
            top: 35%;
            left: 30%;
            opacity: 0.18;
            animation-duration: 40s;
        }

        @keyframes nebulaDrift {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); }
            50% { transform: scale(1.15) translate(40px, -30px) rotate(15deg); }
            100% { transform: scale(0.95) translate(-30px, 30px) rotate(-10deg); }
        }

        /* Yüksek Boyut Yıldızı (Nexus-α) */
        .celestial-source {
            position: fixed;
            top: 30px;
            right: 60px;
            z-index: 150;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.4s ease;
        }

        .celestial-source:hover {
            transform: scale(1.1);
        }

        .source-core {
            width: 38px;
            height: 38px;
            background: radial-gradient(circle, #ffffff 25%, #c084fc 65%, #7928ca 100%);
            border-radius: 50%;
            box-shadow: 
                0 0 25px #ffffff,
                0 0 50px #38bdf8,
                0 0 90px #a855f7;
            position: relative;
            animation: sourcePulse 3s infinite ease-in-out;
        }

        .source-core::before, .source-core::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1.5px solid rgba(224, 195, 252, 0.7);
            animation: starRings 7s infinite linear;
        }

        .source-core::before {
            width: 75px;
            height: 75px;
        }

        .source-core::after {
            width: 110px;
            height: 110px;
            border-style: dashed;
            animation-duration: 16s;
            animation-direction: reverse;
        }

        /* Ateşlendiğinde genişleyen şok dalgası */
        .source-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 0 30px #38bdf8;
            opacity: 0;
            pointer-events: none;
        }

        .source-burst.active {
            animation: starFire 0.9s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        @keyframes starFire {
            0% { width: 30px; height: 30px; opacity: 1; border-width: 4px; }
            50% { opacity: 0.9; }
            100% { width: 220px; height: 220px; opacity: 0; border-width: 1px; }
        }

        .source-flare {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 170px;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
        }

        .source-flare.vertical {
            transform: translate(-50%, -50%) rotate(90deg);
        }

        .source-label {
            margin-top: 25px;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #e0c3fc;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.9);
            white-space: nowrap;
        }

        @keyframes sourcePulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.22); filter: brightness(1.6); }
        }

        @keyframes starRings {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Arka Plana Dönen Astrolojik Çemberler */
        .celestial-rings {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 620px;
            height: 620px;
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(220, 190, 255, 0.14);
        }

        .ring-1 {
            width: 490px;
            height: 490px;
            border-style: dashed;
            border-color: rgba(245, 215, 127, 0.25);
            animation: ringSpin 90s infinite linear;
        }

        .ring-2 {
            width: 590px;
            height: 590px;
            border-color: rgba(168, 85, 247, 0.2);
            animation: ringSpin 120s infinite linear reverse;
        }

        .ring-3 {
            width: 390px;
            height: 390px;
            border-style: dotted;
            border-color: rgba(56, 189, 248, 0.2);
            animation: ringSpin 60s infinite linear;
        }

        @keyframes ringSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Ana Sahne */
        .main-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            position: relative;
            padding: 30px 20px;
            max-width: 700px;
            width: 100%;
        }

        /* Başlık Alanı */
        .header-box {
            text-align: center;
            margin-bottom: 20px;
            z-index: 20;
        }

        .badge-cosmic {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #e0c3fc;
            background: rgba(138, 43, 226, 0.18);
            border: 1px solid rgba(224, 195, 252, 0.35);
            padding: 5px 18px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.3);
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background: #38ef7d;
            border-radius: 50%;
            box-shadow: 0 0 10px #38ef7d;
            animation: blinkDot 1.8s infinite ease-in-out;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2.5px;
            background: linear-gradient(135deg, #ffffff 15%, #f5d77f 55%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(192, 132, 252, 0.5);
            margin-bottom: 6px;
        }

        .sub-header {
            color: #b3a5cf;
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* Soruyu Gir Alanı */
        .question-box {
            position: relative;
            margin-bottom: 22px;
            width: 390px;
            max-width: 90vw;
        }

        .question-input {
            width: 100%;
            background: rgba(18, 12, 38, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 25px;
            padding: 11px 20px;
            font-size: 13.5px;
            color: #f1f5f9;
            font-family: 'Outfit', sans-serif;
            text-align: center;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6), 0 0 20px rgba(138, 43, 226, 0.2);
        }

        .question-input::placeholder {
            color: #7b6f96;
            font-style: italic;
        }

        .question-input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 28px rgba(192, 132, 252, 0.55), inset 0 2px 6px rgba(0,0,0,0.6);
            background: rgba(25, 16, 52, 0.9);
        }

        /* Kozmik Küre */
        .ball-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Dış Hale */
        .ball-aura {
            position: absolute;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.3) 0%, rgba(56, 189, 248, 0.15) 50%, transparent 70%);
            filter: blur(25px);
            pointer-events: none;
            transition: all 0.6s ease;
            z-index: 8;
        }

        .ball-wrapper:hover .ball-aura {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.45) 0%, rgba(56, 189, 248, 0.25) 55%, transparent 75%);
        }

        /* Ana Sihirli Küre */
        .ball-container {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle at 105px 85px, #4d3375 0%, #1a1033 45%, #080314 85%, #020008 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 45px rgba(124, 58, 237, 0.4),
                0 30px 65px rgba(0, 0, 0, 0.95),
                inset 0 -18px 35px rgba(0, 0, 0, 0.9),
                inset 0 12px 25px rgba(255, 255, 255, 0.28),
                inset 0 0 18px rgba(168, 85, 247, 0.4);
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: transform 0.25s ease, box-shadow 0.4s ease;
        }

        .ball-container:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 0 70px rgba(192, 132, 252, 0.65),
                0 35px 75px rgba(0, 0, 0, 0.95),
                inset 0 -18px 35px rgba(0, 0, 0, 0.9),
                inset 0 15px 30px rgba(255, 255, 255, 0.38);
        }

        .ball-container:active {
            transform: scale(0.98);
        }

        /* Küre Üzeri Cam Parlaması */
        .ball-glare {
            position: absolute;
            top: 28px;
            left: 55px;
            width: 85px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.05) 70%, transparent 100%);
            transform: rotate(-35deg);
            pointer-events: none;
            filter: blur(2px);
        }

        /* Küre İçindeki Kozmik Portal Penceresi */
        .window {
            width: 156px;
            height: 156px;
            background: radial-gradient(circle, #08112c 0%, #030612 70%, #010207 100%);
            border: 4px solid #3c2a63;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 
                inset 0 0 38px rgba(0, 0, 0, 0.98),
                0 0 28px rgba(147, 51, 234, 0.5);
            overflow: hidden;
        }

        /* Portal İçi Kozmik Girdap */
        .portal-vortex {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0%, rgba(56, 189, 248, 0.2) 30%, transparent 60%, rgba(192, 132, 252, 0.2) 80%, transparent 100%);
            animation: vortexSpin 9s infinite linear;
            pointer-events: none;
        }

        @keyframes vortexSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Klasik 8 Rakamı */
        .eight-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e2d9f3 50%, #b8a6d9 100%);
            border-radius: 50%;
            color: #120926;
            font-size: 110px;
            font-weight: 800;
            font-family: 'Cinzel', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
            box-shadow: inset 0 -6px 14px rgba(0,0,0,0.4), inset 0 6px 14px rgba(255,255,255,0.7);
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* Kozmik Cevap Üçgeni / Kristali */
        .answer-triangle {
            width: 0;
            height: 0;
            border-left: 58px solid transparent;
            border-right: 58px solid transparent;
            border-bottom: 98px solid #0f2c69;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.4) translateY(20px);
            transition: opacity 0.9s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 5;
            filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.95)) drop-shadow(0 0 28px rgba(168, 85, 247, 0.8));
        }

        .answer-triangle::before {
            content: '';
            position: absolute;
            top: 14px;
            left: -50px;
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 82px solid rgba(30, 64, 175, 0.65);
            pointer-events: none;
        }

        /* Küre İçindeki Cevap Metni */
        .answer-text {
            position: absolute;
            top: 42px;
            width: 86px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            text-align: center;
            text-transform: uppercase;
            line-height: 1.25;
            letter-spacing: 0.8px;
            text-shadow: 
                0 0 8px rgba(255, 255, 255, 1),
                0 0 18px rgba(56, 189, 248, 0.9),
                0 0 25px rgba(168, 85, 247, 0.8);
            z-index: 6;
        }

        /* Titreme Animasyonu */
        .resonating {
            animation: cosmicResonate 0.6s ease infinite alternate;
        }

        @keyframes cosmicResonate {
            0% { transform: scale(1) translate(0, 0); }
            25% { transform: scale(1.02) translate(-3px, 2px); }
            50% { transform: scale(0.99) translate(3px, -2px); }
            75% { transform: scale(1.02) translate(-2px, -3px); }
            100% { transform: scale(1) translate(2px, 3px); }
        }

        /* Şok Dalgası */
        .impact-wave {
            position: absolute;
            width: 156px;
            height: 156px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 0 40px #00d2ff, inset 0 0 30px #c084fc;
            pointer-events: none;
            opacity: 0;
            z-index: 15;
        }

        .animate-impact {
            animation: impactFlash 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes impactFlash {
            0% { transform: scale(0.2); opacity: 1; border-width: 6px; }
            50% { opacity: 0.9; }
            100% { transform: scale(3.2); opacity: 0; border-width: 1px; }
        }

        /* Durum Metni */
        .status-tracker {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 20;
            text-align: center;
        }

        .status-msg {
            color: #d8b4fe;
            font-size: 14px;
            letter-spacing: 1.5px;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            min-height: 22px;
            transition: all 0.3s ease;
        }

        .hint-text {
            color: #8b7ca6;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        /* GELEN KOZMİK MESAJ KARTI (Ekstra Görünürlük Garantisi) */
        .message-reveal-card {
            margin-top: 15px;
            padding: 12px 28px;
            background: rgba(19, 13, 38, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25), inset 0 0 15px rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            max-width: 90vw;
        }

        .message-reveal-card.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .card-sender {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .card-answer {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f5d77f;
            text-shadow: 0 0 12px rgba(245, 215, 127, 0.8);
            text-transform: uppercase;
        }

        /* Kontrol Butonları */
        .controls-bar {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            z-index: 30;
        }

        .cosmic-btn {
            background: rgba(30, 20, 55, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.35);
            color: #d8b4fe;
            border-radius: 22px;
            padding: 9px 20px;
            font-size: 12.5px;
            letter-spacing: 1px;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .cosmic-btn:hover {
            background: rgba(88, 28, 135, 0.7);
            border-color: #c084fc;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.5);
            transform: translateY(-2px);
        }

        /* Mobil Uyumluluk */
        @media (max-width: 600px) {
            h1 { font-size: 24px; }
            .ball-container { width: 260px; height: 260px; }
            .ball-aura { width: 290px; height: 290px; }
            .window { width: 130px; height: 130px; }
            .eight-bg { font-size: 90px; }
            .celestial-source { top: 15px; right: 15px; }
            .source-label { font-size: 9px; margin-top: 18px; }
            .celestial-rings { width: 340px; height: 340px; }
            .ring-1 { width: 280px; height: 280px; }
            .ring-2 { width: 330px; height: 330px; }
            .ring-3 { width: 230px; height: 230px; }
        }
    </style>
</head>
<body>

    <!-- Arka Plan Uzay ve Yıldız Canvası -->
    <canvas id="spaceCanvas"></canvas>
    <!-- Kozmik Efekt ve Uçan Yıldız Canvası (Her şeyin üzerinde) -->
    <canvas id="fxCanvas"></canvas>
    <!-- Darbe Anında Parlama Efekti -->
    <div id="screenFlash"></div>

    <!-- Kozmik Gaz ve Bulutsular (Nebula) -->
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <!-- Dönen Astrolojik Çemberler -->
    <div class="celestial-rings">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
    </div>

    <!-- Yüksek Boyutun Kaynak Yıldızı (Nexus-α) -->
    <div class="celestial-source" id="celestialSource" onclick="askCosmos()">
        <div class="source-core">
            <div class="source-burst" id="sourceBurst"></div>
            <div class="source-flare"></div>
            <div class="source-flare vertical"></div>
        </div>
        <div class="source-label">Yüksek Boyut • Nexus-α</div>
    </div>

    <!-- Ana Sahne -->
    <div class="main-stage">
        
        <div class="header-box">
            <div class="badge-cosmic">
                <span class="badge-dot"></span>
                <span>Kozmik Bilinç Bağlantısı Aktif</span>
            </div>
            <h1>KOZMİK KEHANET KÜRESİ</h1>
            <p class="sub-header">Sorunu kalbinde odakla ve evrensel bilince dokun</p>
        </div>

        <div class="question-box">
            <input type="text" id="userQuestion" class="question-input" placeholder="Aklından geçen soruyu buraya yazabilirsin (isteğe bağlı)..." autocomplete="off" />
        </div>

        <div class="ball-wrapper">
            <div class="ball-aura" id="ballAura"></div>
            <div class="impact-wave" id="impactWave"></div>

            <div class="ball-container" id="ball" onclick="askCosmos()">
                <div class="ball-glare"></div>
                <div class="window">
                    <div class="portal-vortex"></div>
                    <div class="eight-bg" id="eightNumber">8</div>
                    <div class="answer-triangle" id="triangle">
                        <div class="answer-text" id="answer"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-tracker">
            <div class="status-msg" id="statusMsg">Küreye Dokunarak Kozmik İletişimi Başlat</div>
            <div class="hint-text">Sağ üstteki Nexus-α yıldızından ışık elçisi iletilecektir</div>
        </div>

        <!-- Cevap Belirdiğinde Açılan Kozmik Mesaj Kartı -->
        <div class="message-reveal-card" id="messageCard">
            <div class="card-sender">✦ YÜKSEK BOYUT (NEXUS-α) MESAJI ✦</div>
            <div class="card-answer" id="cardAnswerText">EVREN 'EVET' DİYOR</div>
        </div>

        <!-- Kontrol Araç Çubuğu -->
        <div class="controls-bar">
            <button class="cosmic-btn" id="audioToggleBtn" onclick="toggleAudio()">
                <span id="audioIcon">🔊</span>
                <span id="audioText">Kozmik Sesler Açık</span>
            </button>
            <button class="cosmic-btn" onclick="clearBall()">
                <span>✦</span>
                <span>Yeni Soru Sor</span>
            </button>
        </div>

    </div>

    <script>
        /* ==========================================================
           1. KOZMİK ARKA PLAN YILDIZ SİSTEMİ (Canvas)
           ========================================================== */
        const spaceCanvas = document.getElementById('spaceCanvas');
        const sCtx = spaceCanvas.getContext('2d');
        const fxCanvas = document.getElementById('fxCanvas');
        const fCtx = fxCanvas.getContext('2d');

        let width = 0, height = 0;
        let stars = [];
        let backgroundShootingStars = [];
        let cosmicDust = [];

        function resizeCanvases() {
            width = spaceCanvas.width = fxCanvas.width = window.innerWidth;
            height = spaceCanvas.height = fxCanvas.height = window.innerHeight;
            initStars();
        }
        window.addEventListener('resize', resizeCanvases);

        function initStars() {
            stars = [];
            const starCount = Math.floor((width * height) / 3000);
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.8 + 0.3,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.02 + 0.005,
                    pulseFactor: Math.random() * Math.PI * 2,
                    color: getRandomStarColor()
                });
            }

            cosmicDust = [];
            for (let i = 0; i < 40; i++) {
                cosmicDust.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.5 + 1,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    alpha: Math.random() * 0.35 + 0.1,
                    color: ['#c084fc', '#38bdf8', '#f5d77f'][Math.floor(Math.random() * 3)]
                });
            }
        }

        function getRandomStarColor() {
            const colors = ['#ffffff', '#e0c3fc', '#bae6fd', '#fef08a', '#c7d2fe'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function createRandomShootingStar() {
            if (Math.random() < 0.012 && backgroundShootingStars.length < 2) {
                backgroundShootingStars.push({
                    x: Math.random() * width * 0.8,
                    y: Math.random() * (height * 0.35),
                    length: Math.random() * 80 + 40,
                    speed: Math.random() * 8 + 10,
                    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
                    opacity: 1
                });
            }
        }

        function drawSpace() {
            sCtx.clearRect(0, 0, width, height);

            const now = Date.now() * 0.002;
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                const flicker = Math.sin(now * (s.speed * 40) + s.pulseFactor) * 0.3 + 0.7;
                sCtx.beginPath();
                sCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                sCtx.fillStyle = s.color;
                sCtx.globalAlpha = s.alpha * flicker;
                sCtx.shadowBlur = s.size > 1.2 ? 6 : 0;
                sCtx.shadowColor = s.color;
                sCtx.fill();
            }
            sCtx.shadowBlur = 0;

            for (let d of cosmicDust) {
                d.x += d.vx;
                d.y += d.vy;
                if (d.x < 0) d.x = width;
                if (d.x > width) d.x = 0;
                if (d.y < 0) d.y = height;
                if (d.y > height) d.y = 0;

                sCtx.beginPath();
                sCtx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
                sCtx.fillStyle = d.color;
                sCtx.globalAlpha = d.alpha;
                sCtx.fill();
            }

            createRandomShootingStar();
            for (let i = backgroundShootingStars.length - 1; i >= 0; i--) {
                const ss = backgroundShootingStars[i];
                const tailX = ss.x - Math.cos(ss.angle) * ss.length;
                const tailY = ss.y - Math.sin(ss.angle) * ss.length;

                const grad = sCtx.createLinearGradient(ss.x, ss.y, tailX, tailY);
                grad.addColorStop(0, `rgba(255, 255, 255, ${ss.opacity})`);
                grad.addColorStop(0.3, `rgba(168, 85, 247, ${ss.opacity * 0.8})`);
                grad.addColorStop(1, 'transparent');

                sCtx.strokeStyle = grad;
                sCtx.lineWidth = 1.6;
                sCtx.beginPath();
                sCtx.moveTo(ss.x, ss.y);
                sCtx.lineTo(tailX, tailY);
                sCtx.stroke();

                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.opacity -= 0.02;

                if (ss.opacity <= 0 || ss.x > width || ss.y > height) {
                    backgroundShootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(drawSpace);
        }

        resizeCanvases();
        drawSpace();


        /* ==========================================================
           2. YILDIZDAN TOPA UÇAN PARLAK KOZMİK IŞIK ELÇİSİ (Star Beam FX)
           ========================================================== */
        let activeProjectiles = [];
        let activeSparks = [];

        class CosmicProjectile {
            constructor(startX, startY, targetX, targetY, durationMs, onComplete) {
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.startTime = performance.now();
                this.duration = durationMs || 1200; // Milisaniye cinsinden kesin süre
                this.onComplete = onComplete;
                this.completed = false;

                // Kavisli kontrol noktası (Bézier Curve)
                const midX = (startX + targetX) / 2;
                const midY = (startY + targetY) / 2;
                // Sağa ve yukarı doğru doğal yay
                this.ctrlX = midX + 140;
                this.ctrlY = midY - 120;

                this.history = [];
            }

            update(currentTime) {
                const elapsed = currentTime - this.startTime;
                let t = elapsed / this.duration;
                if (t >= 1) t = 1;

                // İkinci dereceden Bezier
                const invT = 1 - t;
                const currX = invT * invT * this.startX + 2 * invT * t * this.ctrlX + t * t * this.targetX;
                const currY = invT * invT * this.startY + 2 * invT * t * this.ctrlY + t * t * this.targetY;

                // Geçmiş iz noktaları ekle
                this.history.unshift({ x: currX, y: currY });
                if (this.history.length > 35) {
                    this.history.pop();
                }

                // Havada parıldayan kıvılcımlar saç
                for (let i = 0; i < 2; i++) {
                    activeSparks.push(new CosmicSpark(
                        currX + (Math.random() - 0.5) * 8, 
                        currY + (Math.random() - 0.5) * 8, 
                        (Math.random() - 0.5) * 3, 
                        (Math.random() - 0.5) * 3, 
                        ['#38bdf8', '#c084fc', '#f5d77f'][Math.floor(Math.random() * 3)],
                        0.7
                    ));
                }

                if (t >= 1 && !this.completed) {
                    this.completed = true;
                    if (this.onComplete) this.onComplete();
                    return false;
                }
                return true;
            }

            draw(ctx) {
                if (this.history.length === 0) return;

                const head = this.history[0];

                // 1. Parlak Geniş Kuyruk Dalgası
                if (this.history.length > 1) {
                    for (let i = 1; i < this.history.length; i++) {
                        const p1 = this.history[i - 1];
                        const p2 = this.history[i];
                        const factor = 1 - (i / this.history.length);

                        // Dış mor/mavi parlama
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(168, 85, 247, ${factor * 0.7})`;
                        ctx.lineWidth = factor * 16 + 2;
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        // İç parlak mavi/cyan çekirdek
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(56, 189, 248, ${factor * 0.9})`;
                        ctx.lineWidth = factor * 8 + 1.5;
                        ctx.stroke();

                        // Merkez saf beyaz hat
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${factor * 0.95})`;
                        ctx.lineWidth = factor * 3.5 + 1;
                        ctx.stroke();
                    }
                }

                // 2. Işık Elçisi Başlığı (Büyük Parlayan Çekirdek)
                // Dış Hale
                const glowGrad = ctx.createRadialGradient(head.x, head.y, 2, head.x, head.y, 42);
                glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                glowGrad.addColorStop(0.25, 'rgba(56, 189, 248, 0.8)');
                glowGrad.addColorStop(0.65, 'rgba(168, 85, 247, 0.45)');
                glowGrad.addColorStop(1, 'rgba(168, 85, 247, 0)');

                ctx.beginPath();
                ctx.arc(head.x, head.y, 42, 0, Math.PI * 2);
                ctx.fillStyle = glowGrad;
                ctx.fill();

                // Parlak Beyaz Merkez Küre
                ctx.beginPath();
                ctx.arc(head.x, head.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#38bdf8';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class CosmicSpark {
            constructor(x, y, vx, vy, color, durationRatio = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color || '#ffffff';
                this.life = 1;
                this.decay = (Math.random() * 0.03 + 0.02) / durationRatio;
                this.size = Math.random() * 3.5 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                return this.life > 0;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        function drawEffects(timestamp) {
            fCtx.clearRect(0, 0, width, height);

            for (let i = activeProjectiles.length - 1; i >= 0; i--) {
                const p = activeProjectiles[i];
                if (!p.update(timestamp)) {
                    activeProjectiles.splice(i, 1);
                } else {
                    p.draw(fCtx);
                }
            }

            for (let i = activeSparks.length - 1; i >= 0; i--) {
                const s = activeSparks[i];
                if (!s.update()) {
                    activeSparks.splice(i, 1);
                } else {
                    s.draw(fCtx);
                }
            }

            requestAnimationFrame(drawEffects);
        }
        requestAnimationFrame(drawEffects);


        /* ==========================================================
           3. SES SİSTEMİ (Web Audio API)
           ========================================================== */
        let audioCtx = null;
        let audioEnabled = true;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const icon = document.getElementById('audioIcon');
            const text = document.getElementById('audioText');
            if (audioEnabled) {
                icon.innerText = '🔊';
                text.innerText = 'Kozmik Sesler Açık';
            } else {
                icon.innerText = '🔇';
                text.innerText = 'Sesler Kapalı';
            }
        }

        function playStarLaunchSound() {
            if (!audioEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 1.1);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.25, now + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 1.2);
            } catch(e) {}
        }

        function playImpactChimeSound() {
            if (!audioEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const freqs = [264, 528, 792, 1056, 1320];
                freqs.forEach((f, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = idx === 0 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(f, now);

                    const amp = 0.18 / (idx + 1);
                    gain.gain.setValueAtTime(0.01, now);
                    gain.gain.linearRampToValueAtTime(amp, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + 2.5);
                });
            } catch(e) {}
        }


        /* ==========================================================
           4. SİHİRLİ 8 TOPU VE YILDIZDAN MESAJ AKIŞI
           ========================================================== */
        const CEVAPLAR = [
            "Evren 'Evet' Diyor",
            "Yıldızlar Onaylıyor",
            "Kozmik Akış Şüphesiz",
            "Kaderin Lehine",
            "Işık Yolunu Açtı",
            "Yüksek İhtimal",
            "Kozmik Sis: Belirsiz",
            "Zamanı Henüz Değil",
            "Evrene Güven ve Bekle",
            "Soru Zihninde Bulanık",
            "Frekansın Düşük: Hayır",
            "Kozmik Denge İzin Vermiyor",
            "Yıldızlar Karşı Duruyor",
            "Bu Yol Sana Göre Değil",
            "Kader 'Asla' Fısıldıyor"
        ];

        let isAsking = false;

        function askCosmos() {
            if (isAsking) return;
            isAsking = true;

            const ball = document.getElementById('ball');
            const statusMsg = document.getElementById('statusMsg');
            const celestialSource = document.getElementById('celestialSource');
            const sourceBurst = document.getElementById('sourceBurst');
            const impactWave = document.getElementById('impactWave');
            const screenFlash = document.getElementById('screenFlash');
            const eightNumber = document.getElementById('eightNumber');
            const triangle = document.getElementById('triangle');
            const answerText = document.getElementById('answer');
            const messageCard = document.getElementById('messageCard');
            const cardAnswerText = document.getElementById('cardAnswerText');

            // 1. Önceki durumu temizle ve 8'i hazır tut
            eightNumber.style.opacity = '1';
            eightNumber.style.transform = 'scale(1) rotate(0deg)';
            triangle.style.opacity = '0';
            triangle.style.transform = 'scale(0.4) translateY(20px)';
            messageCard.classList.remove('show');

            statusMsg.innerText = "✨ Nexus-α Yıldızından Kozmik Mesaj Ateşlendi...";
            statusMsg.style.color = "#38bdf8";

            // 2. Küre boyutsal rezonans titresin
            ball.classList.add('resonating');

            // 3. Yıldızda patlama halkasını tetikle
            sourceBurst.classList.remove('active');
            void sourceBurst.offsetWidth;
            sourceBurst.classList.add('active');

            // Ses
            playStarLaunchSound();

            // 4. Yıldızın ve Topun Güncel Ekran Koordinatlarını Al
            const sourceCore = celestialSource.querySelector('.source-core');
            const sourceRect = sourceCore.getBoundingClientRect();
            const startX = sourceRect.left + sourceRect.width / 2;
            const startY = sourceRect.top + sourceRect.height / 2;

            const windowEl = document.querySelector('.window');
            const windowRect = windowEl.getBoundingClientRect();
            const targetX = windowRect.left + windowRect.width / 2;
            const targetY = windowRect.top + windowRect.height / 2;

            // 5. Işık Elçisini Yıldızdan Küreye Uçur (1.2 saniye sürer)
            const projectile = new CosmicProjectile(startX, startY, targetX, targetY, 1200, () => {
                // ==========================================
                // IŞIK TOPA ULAŞTIĞINDA GERÇEKLEŞENLER:
                // ==========================================
                ball.classList.remove('resonating');

                // Ekran Parlaması
                screenFlash.style.opacity = '1';
                setTimeout(() => { screenFlash.style.opacity = '0'; }, 160);

                // Şok Dalgası
                impactWave.classList.remove('animate-impact');
                void impactWave.offsetWidth;
                impactWave.classList.add('animate-impact');

                // Kıvılcım Patlaması
                for (let i = 0; i < 55; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 7 + 2;
                    const colors = ['#ffffff', '#38bdf8', '#c084fc', '#f5d77f'];
                    activeSparks.push(new CosmicSpark(
                        targetX, 
                        targetY, 
                        Math.cos(angle) * speed, 
                        Math.sin(angle) * speed, 
                        colors[Math.floor(Math.random() * colors.length)],
                        1.5
                    ));
                }

                // Kristal Çanı Sesi
                playImpactChimeSound();

                // Rastgele Cevap Belirle
                const randomIndex = Math.floor(Math.random() * CEVAPLAR.length);
                const selectedAnswer = CEVAPLAR[randomIndex];

                // 8 Rakamını KESİN OLARAK Gizle ve Döndür
                eightNumber.style.opacity = '0';
                eightNumber.style.transform = 'scale(0.2) rotate(180deg)';

                // Cevap Üçgenini KESİN OLARAK Göster ve Yükselt
                answerText.innerText = selectedAnswer;
                triangle.style.opacity = '1';
                triangle.style.transform = 'scale(1) translateY(0)';

                // Kartı Göster
                cardAnswerText.innerText = selectedAnswer;
                messageCard.classList.add('show');

                statusMsg.innerText = "✦ KOZMİK HAKİKAT BELİRDİ ✦";
                statusMsg.style.color = "#f5d77f";

                setTimeout(() => {
                    isAsking = false;
                }, 800);
            });

            activeProjectiles.push(projectile);
        }

        // Yeni Soru İçin Sıfırlama
        function clearBall() {
            if (isAsking) return;
            const statusMsg = document.getElementById('statusMsg');
            const input = document.getElementById('userQuestion');
            const eightNumber = document.getElementById('eightNumber');
            const triangle = document.getElementById('triangle');
            const messageCard = document.getElementById('messageCard');

            eightNumber.style.opacity = '1';
            eightNumber.style.transform = 'scale(1) rotate(0deg)';
            triangle.style.opacity = '0';
            triangle.style.transform = 'scale(0.4) translateY(20px)';
            messageCard.classList.remove('show');

            statusMsg.innerText = "Küreye Dokunarak Kozmik İletişimi Başlat";
            statusMsg.style.color = "#d8b4fe";
            input.value = '';
            input.focus();
        }

        // Enter tuşu ile soru sorma
        document.getElementById('userQuestion').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askCosmos();
            }
        });
    </script>
