<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Shell Game - Find the Ping Pong Ball</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter & Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .game-title {
            font-family: 'Fredoka', cursive, sans-serif;
        }

        /* Perspective Table Scene */
        .table-viewport {
            perspective: 1000px;
            perspective-origin: 50% 30%;
        }

        .table-surface {
            transform: rotateX(25deg);
            transform-style: preserve-3d;
            background: radial-gradient(circle at 50% 30%, #3e2723 0%, #24140e 70%, #150a06 100%);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 2px 15px rgba(255,255,255,0.1);
        }

        .wood-texture {
            background-image: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0, 0, 0, 0.15) 3px, rgba(0, 0, 0, 0.15) 6px);
        }

        /* Cup & Shadow Elements */
        .cup-wrapper {
            position: absolute;
            bottom: 22%;
            width: 110px;
            height: 140px;
            margin-left: -55px;
            transition: transform 0.1s linear, top 0.4s ease, bottom 0.4s ease;
            transform-style: preserve-3d;
            cursor: pointer;
            z-index: 10;
        }

        /* High visual fidelity CSS Red Cup */
        .cup-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 40%, #8b0000 100%);
            clip-path: polygon(12% 0%, 88% 0%, 100% 100%, 0% 100%);
            border-radius: 8px 8px 12px 12px;
            position: relative;
            box-shadow: inset -15px 0 20px rgba(0,0,0,0.4), inset 15px 0 20px rgba(255,255,255,0.3);
            border-top: 6px solid #e63946;
        }

        .cup-rim {
            position: absolute;
            bottom: 0;
            left: -2%;
            width: 104%;
            height: 12px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 -2px 4px rgba(0,0,0,0.2);
        }

        .cup-ribs {
            position: absolute;
            top: 30%;
            width: 100%;
            height: 35%;
            background: repeating-linear-gradient(
                180deg,
                transparent,
                transparent 8px,
                rgba(0, 0, 0, 0.12) 8px,
                rgba(0, 0, 0, 0.12) 14px
            );
        }

        /* Cup Shadow */
        .cup-shadow {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            transition: all 0.4s ease;
            z-index: 5;
            pointer-events: none;
        }

        /* Ping Pong Ball */
        .ping-pong-ball {
            position: absolute;
            bottom: 24%;
            width: 36px;
            height: 36px;
            margin-left: -18px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ffb703 60%, #fb8500 100%);
            border-radius: 50%;
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.3), 0 8px 15px rgba(0,0,0,0.5);
            z-index: 6;
            transition: left 0.1s linear;
        }

        /* Hand Overlay */
        .hand-icon {
            position: absolute;
            top: -75px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 52px;
            color: #ffe0bd;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.5));
            transition: transform 0.2s ease, opacity 0.3s ease;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
        }

        .hand-icon.active {
            opacity: 1;
        }

        /* Lifted Cup Effect */
        .cup-lifted {
            transform: translateY(-80px) scale(1.05) !important;
        }
        
        .cup-lifted .cup-shadow {
            transform: translateX(-50%) scale(0.6);
            opacity: 0.3;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Custom Pulse for Timer */
        @keyframes timerPulse {
            0% { transform: scale(1); color: #fbbf24; }
            50% { transform: scale(1.1); color: #ef4444; }
            100% { transform: scale(1); color: #fbbf24; }
        }

        .timer-warning {
            animation: timerPulse 0.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-amber-500 selection:text-white">

    <!-- TOP BAR / HEADER -->
    <header class="w-full max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4 z-20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-red-500 flex items-center justify-center shadow-lg shadow-amber-500/30">
                <i class="fa-solid fa-table-tennis-paddle-ball text-xl text-white"></i>
            </div>
            <div>
                <h1 class="game-title text-2xl md:text-3xl font-bold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-orange-300 to-red-400">
                    Find The Ball
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">Classic 3D Ping Pong Shell Game</p>
            </div>
        </div>

        <!-- STATS BOARD -->
        <div class="flex items-center gap-3 md:gap-6 glass-panel px-4 py-2 rounded-2xl shadow-inner">
            <div class="text-center px-2">
                <span class="block text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Score</span>
                <span id="scoreVal" class="text-xl md:text-2xl font-bold text-amber-400">0</span>
            </div>
            <div class="h-8 w-[1px] bg-white/10"></div>
            <div class="text-center px-2">
                <span class="block text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Streak</span>
                <span id="streakVal" class="text-xl md:text-2xl font-bold text-emerald-400">0</span>
            </div>
            <div class="h-8 w-[1px] bg-white/10"></div>
            <div class="text-center px-2">
                <span class="block text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Best</span>
                <span id="highScoreVal" class="text-xl md:text-2xl font-bold text-purple-400">0</span>
            </div>
            <button id="soundToggle" class="ml-2 w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition active:scale-95" title="Toggle Sound">
                <i id="soundIcon" class="fa-solid fa-volume-high text-amber-400"></i>
            </button>
        </div>
    </header>

    <!-- MAIN GAME AREA -->
    <main class="w-full max-w-4xl mx-auto px-4 flex-1 flex flex-col justify-center items-center my-2">
        
        <!-- STATUS / INSTRUCTION BANNER -->
        <div class="w-full max-w-md text-center mb-4">
            <div id="statusBox" class="glass-panel py-3 px-6 rounded-2xl border border-white/10 shadow-xl transition-all duration-300">
                <p id="statusMsg" class="text-base md:text-lg font-semibold text-amber-200">
                    Press <span class="text-emerald-400 font-bold">START GAME</span> to begin!
                </p>
            </div>
            
            <!-- COUNTDOWN TIMER -->
            <div id="timerContainer" class="mt-3 opacity-0 transition-opacity duration-300 flex items-center justify-center gap-2">
                <i class="fa-solid fa-stopwatch text-amber-400 text-lg"></i>
                <span class="text-sm text-slate-300 font-medium">Shuffling Time:</span>
                <span id="timerVal" class="text-2xl font-bold font-mono text-amber-400">5.0s</span>
            </div>
        </div>

        <!-- 3D TABLE SCENE -->
        <div class="table-viewport w-full max-w-2xl h-[320px] sm:h-[380px] relative flex items-center justify-center">
            
            <!-- WOODEN TABLE TOP SURFACE -->
            <div class="table-surface wood-texture w-full h-full rounded-3xl relative border-4 border-amber-950/80 overflow-hidden flex items-center justify-center">
                
                <!-- Table Decorative Border Line -->
                <div class="absolute inset-4 border border-white/10 rounded-2xl pointer-events-none"></div>

                <!-- PING PONG BALL -->
                <div id="pingPongBall" class="ping-pong-ball"></div>

                <!-- CUP 0 -->
                <div id="cup0" class="cup-wrapper" data-index="0">
                    <div class="hand-icon" id="hand0"><i class="fa-solid fa-hand-back-fist"></i></div>
                    <div class="cup-body">
                        <div class="cup-ribs"></div>
                    </div>
                    <div class="cup-rim"></div>
                    <div class="cup-shadow"></div>
                </div>

                <!-- CUP 1 -->
                <div id="cup1" class="cup-wrapper" data-index="1">
                    <div class="hand-icon" id="hand1"><i class="fa-solid fa-hand-back-fist"></i></div>
                    <div class="cup-body">
                        <div class="cup-ribs"></div>
                    </div>
                    <div class="cup-rim"></div>
                    <div class="cup-shadow"></div>
                </div>

                <!-- CUP 2 -->
                <div id="cup2" class="cup-wrapper" data-index="2">
                    <div class="hand-icon" id="hand2"><i class="fa-solid fa-hand-back-fist"></i></div>
                    <div class="cup-body">
                        <div class="cup-ribs"></div>
                    </div>
                    <div class="cup-rim"></div>
                    <div class="cup-shadow"></div>
                </div>

            </div>
        </div>

        <!-- CONTROLS & ACTIONS -->
        <div class="mt-6 flex flex-wrap justify-center items-center gap-4">
            <button id="startBtn" class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 active:scale-95 font-bold text-lg shadow-lg shadow-emerald-500/25 transition-all flex items-center gap-3">
                <i class="fa-solid fa-play"></i> START GAME
            </button>
            <button id="resetBtn" class="px-6 py-3.5 rounded-2xl glass-panel hover:bg-white/20 active:scale-95 font-semibold text-slate-200 transition-all flex items-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full text-center py-4 text-xs text-slate-500 border-t border-white/5">
        <p>Keep your eyes peeled! Speed increases dynamically during the 5s shuffle.</p>
    </footer>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        // --- SOUND SYNTHESIZER (WEB AUDIO API) ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSwapSound(pitch = 1.0) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150 * pitch, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80 * pitch, this.ctx.currentTime + 0.08);

                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            }

            playWinSound() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);

                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.09 + 0.25);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start(this.ctx.currentTime + idx * 0.09);
                        osc.stop(this.ctx.currentTime + idx * 0.09 + 0.25);
                    });
                } catch(e) {}
            }

            playLoseSound() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.3);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e) {}
            }
        }

        const sound = new SoundSystem();

        // --- GAME STATE ---
        const GameState = {
            IDLE: 'IDLE',
            COVERING: 'COVERING',
            SHUFFLING: 'SHUFFLING',
            WAITING_GUESS: 'WAITING_GUESS',
            REVEALING: 'REVEALING'
        };

        let currentState = GameState.IDLE;
        let score = 0;
        let streak = 0;
        let highScore = localStorage.getItem('shell_game_highscore') || 0;

        // Ball position (0, 1, or 2 index)
        let ballCupIndex = 1; // Default middle

        // Current layout positions of cups array [cupIndex0_pos, cupIndex1_pos, cupIndex2_pos]
        // Example: cupPositions[0] = 2 means Cup #0 is currently physically at Slot #2
        let cupPositions = [0, 1, 2]; // Slot positions: 0 = Left, 1 = Center, 2 = Right
        
        // Timer reference
        let shuffleTimer = null;
        let shuffleStartTime = 0;
        const SHUFFLE_DURATION = 5000; // Exactly 5 seconds

        // DOM Elements
        const cupElems = [
            document.getElementById('cup0'),
            document.getElementById('cup1'),
            document.getElementById('cup2')
        ];
        const handElems = [
            document.getElementById('hand0'),
            document.getElementById('hand1'),
            document.getElementById('hand2')
        ];
        const pingPongBall = document.getElementById('pingPongBall');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');
        const timerContainer = document.getElementById('timerContainer');
        const timerVal = document.getElementById('timerVal');
        const scoreVal = document.getElementById('scoreVal');
        const streakVal = document.getElementById('streakVal');
        const highScoreVal = document.getElementById('highScoreVal');
        const soundToggle = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');

        // Init UI High Score
        highScoreVal.textContent = highScore;

        // --- POSITIONING CALCULATIONS ---
        // Calculate X coordinate percentage or pixels for 3 slots across screen width
        function getSlotXCoordinate(slotIndex) {
            const viewportWidth = document.querySelector('.table-viewport').offsetWidth;
            // 3 Slots spaced evenly: 20%, 50%, 80%
            const percentages = [0.22, 0.50, 0.78];
            return viewportWidth * percentages[slotIndex];
        }

        // Render current positions of cups & ball based on state
        function updatePositions(animated = true) {
            cupElems.forEach((cup, cupIdx) => {
                const currentSlot = cupPositions[cupIdx];
                const xPos = getSlotXCoordinate(currentSlot);

                if (!animated) {
                    cup.style.transition = 'none';
                } else {
                    cup.style.transition = 'left 0.18s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease';
                }

                cup.style.left = `${xPos}px`;
            });

            // Update Ball position to match its current cup slot
            const ballSlot = cupPositions[ballCupIndex];
            const ballXPos = getSlotXCoordinate(ballSlot);
            pingPongBall.style.left = `${ballXPos}px`;
        }

        // Lift cups up or lower them
        function setCupsLifted(lifted) {
            cupElems.forEach(cup => {
                if (lifted) {
                    cup.classList.add('cup-lifted');
                } else {
                    cup.classList.remove('cup-lifted');
                }
            });
        }

        // Show hands on active swapping cups
        function setHandsActive(cupIndexA, cupIndexB) {
            handElems.forEach((hand, idx) => {
                if (idx === cupIndexA || idx === cupIndexB) {
                    hand.classList.add('active');
                } else {
                    hand.classList.remove('active');
                }
            });
        }

        function clearHands() {
            handElems.forEach(hand => hand.classList.remove('active'));
        }

        // --- INITIAL GAME SETUP ---
        function initScene() {
            currentState = GameState.IDLE;
            cupPositions = [0, 1, 2]; // reset slots
            
            // Randomly choose initial ball cup index
            ballCupIndex = Math.floor(Math.random() * 3);

            // Set positions without transition
            updatePositions(false);

            // Lift cups so player sees ball initially
            setCupsLifted(true);
            clearHands();

            statusMsg.innerHTML = 'Memorize where the <span class="text-amber-400 font-bold">Ping Pong Ball</span> is!';
            timerContainer.classList.add('opacity-0');
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // Window resize handler to maintain accurate cup slots
        window.addEventListener('resize', () => {
            updatePositions(false);
        });

        // --- SHUFFLE ENGINE ---
        async function startShuffleSequence() {
            sound.init();
            if (currentState !== GameState.IDLE) return;

            currentState = GameState.COVERING;
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');

            statusMsg.innerHTML = '<span class="text-amber-300">Covering the ball...</span>';

            // 1. Lower cups over ball
            setCupsLifted(false);

            await new Promise(res => setTimeout(res, 600));

            // 2. Start Shuffle Phase
            currentState = GameState.SHUFFLING;
            statusMsg.innerHTML = '<span class="text-red-400 font-bold animate-pulse">Shuffling! Keep your eyes on the ball!</span>';
            timerContainer.classList.remove('opacity-0');

            shuffleStartTime = Date.now();
            
            // Begin loop for continuous dynamic acceleration swap
            runShuffleLoop();
        }

        async function runShuffleLoop() {
            const elapsedTime = Date.now() - shuffleStartTime;
            const remainingTime = Math.max(0, SHUFFLE_DURATION - elapsedTime);

            // Update timer text
            timerVal.textContent = (remainingTime / 1000).toFixed(1) + 's';
            if (remainingTime <= 3000) {
                timerVal.classList.add('timer-warning');
            } else {
                timerVal.classList.remove('timer-warning');
            }

            // Check if 5 seconds complete
            if (elapsedTime >= SHUFFLE_DURATION) {
                endShuffleSequence();
                return;
            }

            // DYNAMIC ACCELERATION LOGIC:
            // Calculate progress from 0.0 to 1.0
            const progress = elapsedTime / SHUFFLE_DURATION;
            
            // Cap the acceleration during the final second (progress >= 0.8 / last 1 second)
            // so the minimum delay never drops below 230ms (reduced max speed for high trackability)
            const cappedProgress = Math.min(progress, 0.8);
            const currentSwapDelay = 380 - (cappedProgress * 180); // Min delay capped at 236ms (~4.2 swaps/sec max)

            // Pick 2 distinct random cup indices to swap
            let idxA = Math.floor(Math.random() * 3);
            let idxB = Math.floor(Math.random() * 3);
            while (idxB === idxA) {
                idxB = Math.floor(Math.random() * 3);
            }

            // Swap slot positions in array
            const tempSlot = cupPositions[idxA];
            cupPositions[idxA] = cupPositions[idxB];
            cupPositions[idxB] = tempSlot;

            // Show hand graphics on swapping cups
            setHandsActive(idxA, idxB);

            // Play audio click
            sound.playSwapSound(0.8 + progress * 0.6);

            // Update cup DOM positions smoothly
            updatePositions(true);

            // Schedule next swap
            setTimeout(() => {
                if (currentState === GameState.SHUFFLING) {
                    runShuffleLoop();
                }
            }, currentSwapDelay);
        }

        function endShuffleSequence() {
            currentState = GameState.WAITING_GUESS;
            clearHands();
            timerVal.textContent = '0.0s';
            timerVal.classList.remove('timer-warning');

            statusMsg.innerHTML = '👉 <span class="text-amber-300 font-bold">Which cup is the Ping Pong Ball under?</span>';
        }

        // --- GUESSING & REVEAL ---
        function handleCupClick(clickedCupIndex) {
            sound.init();
            if (currentState !== GameState.WAITING_GUESS) return;

            currentState = GameState.REVEALING;

            // Reveal all cups
            setCupsLifted(true);

            const isCorrect = (clickedCupIndex === ballCupIndex);

            if (isCorrect) {
                // WINNER
                score++;
                streak++;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('shell_game_highscore', highScore);
                    highScoreVal.textContent = highScore;
                }

                scoreVal.textContent = score;
                streakVal.textContent = streak;

                statusMsg.innerHTML = '🎉 <span class="text-emerald-400 font-bold">CORRECT! Excellent Eyes!</span>';
                sound.playWinSound();

                // Confetti FX
                try {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                } catch(e) {}

            } else {
                // LOSER
                streak = 0;
                streakVal.textContent = streak;

                statusMsg.innerHTML = '❌ <span class="text-red-400 font-bold">WRONG! Better luck next time!</span>';
                sound.playLoseSound();

                // Highlight clicked wrong cup with red border briefly
                const wrongCup = cupElems[clickedCupIndex];
                wrongCup.style.filter = 'drop-shadow(0 0 15px rgba(239, 68, 68, 0.8))';
                setTimeout(() => {
                    wrongCup.style.filter = 'none';
                }, 1500);
            }

            // Enable Play Again via Start Button
            setTimeout(() => {
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                startBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> PLAY AGAIN';
                
                // Clicking Play Again re-inits scene
                currentState = GameState.IDLE;
            }, 1200);
        }

        // --- EVENT LISTENERS ---
        startBtn.addEventListener('click', () => {
            if (currentState === GameState.IDLE) {
                startBtn.innerHTML = '<i class="fa-solid fa-play"></i> START GAME';
                startShuffleSequence();
            }
        });

        resetBtn.addEventListener('click', () => {
            score = 0;
            streak = 0;
            scoreVal.textContent = score;
            streakVal.textContent = streak;
            startBtn.innerHTML = '<i class="fa-solid fa-play"></i> START GAME';
            initScene();
        });

        cupElems.forEach((cup, idx) => {
            cup.addEventListener('click', () => {
                handleCupClick(idx);
            });
        });

        // Sound Toggle
        soundToggle.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            if (sound.enabled) {
                soundIcon.className = 'fa-solid fa-volume-high text-amber-400';
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
            }
        });

        // --- INIT ON LOAD ---
        window.onload = () => {
            initScene();
        };
    </script>
</body>
</html>
